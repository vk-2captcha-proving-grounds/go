</head>
<body>
    <script>
        const idx = new URLSearchParams(location.search).get('id');
        if (idx !== null) {
            fetch('urls.json')
                .then(r => r.json())
                .then(d => {
                    if (d[parseInt(idx)]) {
                        location.replace(d[parseInt(idx)]);
                    }
                });
        }
    </script>
</body>
